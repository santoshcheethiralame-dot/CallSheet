<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALLSHEET — Director review</title>
<style>
/* ---------------------------------------------------------------------------
   CALLSHEET

   The page IS the call sheet, on a desk in a dark suite at 2am.

   Film call sheets are reissued on coloured paper as the day is revised:
   white, then blue, then pink, then goldenrod. Every crew member knows that
   holding goldenrod means it has gone badly. Each decision the agent makes
   reissues the sheet and advances the stock — and the reissue happens on
   screen, because that is the one moment worth watching here.

   Everything else stays quiet.
   --------------------------------------------------------------------------- */

:root {
  --suite-black: #14171A;
  --suite-line:  #262D34;
  --stock-white: #EDE9DE;
  --stock-blue:  #9CC0DA;
  --stock-pink:  #E7A6B7;
  --stock-gold:  #DFAE52;
  --grease:      #A8331F;
  --in-the-can:  #4C6B55;
  --ink:         #14181B;
  --ink-mid:     rgba(20, 24, 27, 0.62);
  --ink-faint:   rgba(20, 24, 27, 0.28);
  --dark-soft:   #6B7379;

  --display: "Bahnschrift", "Archivo Narrow", "Haettenschweiler", Impact, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
  --body: system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--suite-black);
  color: var(--stock-white);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--stock-gold); outline-offset: 3px; }

/* --- the slate: everything that is not the sheet ---------------------------- */

.slate {
  display: flex;
  align-items: baseline;
  gap: 22px;
  padding: 14px 26px;
  border-bottom: 1px solid var(--suite-line);
}

.slate__mark {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.slate__review {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dark-soft);
}

.slate__clock {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 22px;
  font-variant-numeric: tabular-nums;
}

.slate__clock[data-late="true"] { color: var(--stock-gold); }

.banner {
  display: none;
  margin: 14px 26px 0;
  padding: 9px 14px;
  border-left: 3px solid var(--stock-gold);
  background: rgba(223, 174, 82, 0.09);
  font-size: 13px;
}

.banner[data-show="true"] { display: block; }

/* --- the desk --------------------------------------------------------------- */

.desk {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 268px;
  gap: 30px;
  /* Centred, so a short sheet sits on the desk rather than clinging to the top
     with a field of empty dark below it. A long sheet grows past centre and the
     page simply scrolls. */
  align-items: center;
  padding: 26px;
  max-width: 1240px;
  margin: 0 auto;
  min-height: calc(100vh - 52px);
}

/* --- the sheet -------------------------------------------------------------- */

.sheet {
  position: relative;
  background: var(--stock-white);
  color: var(--ink);
  padding: 34px 38px 30px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 2px 0 rgba(0, 0, 0, 0.3);
  /* Paper is not flat. A whisper of tooth, not a texture effect. */
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.014) 0 1px, transparent 1px 3px);
}

.sheet[data-stock="blue"] { background-color: var(--stock-blue); }
.sheet[data-stock="pink"] { background-color: var(--stock-pink); }
.sheet[data-stock="goldenrod"] { background-color: var(--stock-gold); }

/* The reissue: the whole sheet is replaced, and you see it happen. */
.sheet--issuing { animation: reissue 560ms cubic-bezier(.16,.84,.36,1) both; }

@keyframes reissue {
  0%   { transform: translateY(-14px) rotate(-0.7deg); opacity: 0; }
  55%  { transform: translateY(2px) rotate(0.15deg); opacity: 1; }
  100% { transform: none; }
}

.sheet__head {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 22px;
}

.sheet__title {
  font-family: var(--display);
  font-size: 34px;
  line-height: 1;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  margin: 0 0 6px;
}

.sheet__meta {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mid);
}

.stamp {
  margin-left: auto;
  flex: none;
  transform: rotate(-6deg);
  border: 2.5px solid rgba(20, 24, 27, 0.5);
  color: rgba(20, 24, 27, 0.62);
  font-family: var(--display);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
  padding: 7px 13px 6px;
}

.stamp__n { display: block; font-size: 25px; line-height: 1; }
.stamp__stock { display: block; font-size: 10px; letter-spacing: 0.2em; margin-top: 2px; }

/* --- the shot table: rows on a document, numbered ---------------------------- */

.cols,
.row {
  display: grid;
  grid-template-columns: 28px 132px minmax(0, 1fr) 66px 62px minmax(0, 1.05fr);
  gap: 18px;
  align-items: center;
}

.cols {
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 0.19em;
  text-transform: uppercase;
  color: var(--ink-mid);
  padding-bottom: 7px;
  border-bottom: 1.5px solid rgba(20, 24, 27, 0.55);
}

.row {
  position: relative;
  padding: 9px 0;
  border-bottom: 1px solid var(--ink-faint);
}

.row__n {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-mid);
}

.row__frame {
  width: 132px;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  display: block;
  background: rgba(20, 24, 27, 0.14);
}

.row__frame--empty {
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.1em;
  color: var(--ink-mid);
}

.row__shot { font-family: var(--mono); font-size: 15px; letter-spacing: 0.05em; }

.row__quality,
.row__count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-mid);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.row__status {
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.row[data-state="in_the_can"] .row__status { color: var(--in-the-can); }
.row[data-state="at_risk"] .row__status { color: var(--grease); }
.row[data-state="struck"] { opacity: 0.5; }

/* Goldenrod marks the shot that put the day on goldenrod paper. */
.row[data-state="at_risk"]::before {
  content: "";
  position: absolute;
  left: -38px;
  top: 0;
  bottom: 0;
  width: 5px;
  background: var(--grease);
}

.row__strike {
  position: absolute;
  left: -6px;
  right: -6px;
  top: 0;
  bottom: 0;
  pointer-events: none;
}

.row__strike path {
  stroke: var(--grease);
  stroke-width: 2.5;
  stroke-linecap: round;
  fill: none;
  opacity: 0.9;
  stroke-dasharray: 620;
  stroke-dashoffset: 620;
  animation: strike 520ms ease-out forwards;
}

@keyframes strike { to { stroke-dashoffset: 0; } }

/* --- the amendment ---------------------------------------------------------- */

.amend { margin-top: 26px; }

.amend__label {
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-mid);
  margin-bottom: 8px;
}

.amend__summary { margin: 0 0 12px; font-size: 15px; max-width: 62ch; }

.act {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 14px;
  font-family: var(--mono);
  font-size: 12px;
  padding: 4px 0;
}

.act__verb { letter-spacing: 0.12em; text-transform: uppercase; }
.act__why { color: var(--ink-mid); }

.act--refused .act__verb,
.act--refused .act__why { color: var(--ink-faint); text-decoration: line-through; }

.gap {
  margin-top: 20px;
  padding: 12px 0 0;
  border-top: 2.5px solid var(--grease);
  color: var(--grease);
}

.gap__label {
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.gap__line { font-family: var(--mono); font-size: 12px; }

/* --- marginalia ------------------------------------------------------------- */

.margin {
  border-left: 1px solid var(--suite-line);
  padding-left: 20px;
  align-self: stretch;
}

.margin__label {
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--dark-soft);
  margin-bottom: 12px;
}

.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }

.feed__item { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; font-size: 12.5px; }
.feed__time { font-family: var(--mono); font-size: 10.5px; color: var(--dark-soft); padding-top: 2px; }
.feed__empty { color: var(--dark-soft); font-size: 13px; margin: 0; }

@media (max-width: 880px) {
  .desk { grid-template-columns: minmax(0, 1fr); gap: 26px; padding: 20px 14px 40px; }
  .sheet { padding: 24px 20px 22px; }
  .cols { display: none; }
  .row {
    grid-template-columns: 20px 92px minmax(0, 1fr);
    grid-template-areas: "n frame shot" ". frame status";
    row-gap: 2px;
  }
  .row__n { grid-area: n; }
  .row__frame, .row__frame--empty { grid-area: frame; width: 92px; }
  .row__shot { grid-area: shot; }
  .row__status { grid-area: status; }
  .row__quality, .row__count { display: none; }
  .row[data-state="at_risk"]::before { left: -20px; }
  .sheet__title { font-size: 26px; }
  .slate__clock { font-size: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .sheet--issuing { animation: none; }
  .row__strike path { animation: none; stroke-dashoffset: 0; }
}
</style>
</head>
<body>

<header class="slate">
  <span class="slate__mark">Callsheet</span>
  <span class="slate__review" id="review">&mdash;</span>
  <span class="slate__clock" id="clock">--:--</span>
</header>

<p class="banner" id="banner"></p>

<div class="desk">
  <article class="sheet" id="sheet" data-stock="white">
    <div class="sheet__head">
      <div>
        <h1 class="sheet__title">Call sheet</h1>
        <div class="sheet__meta" id="sheetMeta">Awaiting the first round</div>
      </div>
      <div class="stamp" id="stamp">
        <span class="stamp__n">Rev 0</span>
        <span class="stamp__stock">White</span>
      </div>
    </div>

    <div class="cols">
      <span>&numero;</span><span>Frame</span><span>Shot</span>
      <span>Qual</span><span>Done</span><span>Status</span>
    </div>
    <div id="rows"></div>

    <section class="amend">
      <div class="amend__label">Amendment</div>
      <p class="amend__summary" id="summary">No amendment has been issued.</p>
      <div id="acts"></div>
      <div class="gap" id="gap" hidden>
        <div class="gap__label">Gap not closed</div>
        <div class="gap__line" id="gapLine"></div>
      </div>
    </section>
  </article>

  <aside class="margin">
    <div class="margin__label">Event feed</div>
    <ul class="feed" id="feed"></ul>
    <p class="feed__empty" id="feedEmpty">Nothing yet tonight.</p>
  </aside>
</div>

<script>
const STOCK = { white: "White", blue: "Blue", pink: "Pink", goldenrod: "Goldenrod" };
const STATUS = {
  waiting: "Waiting", rendering: "Rendering", in_the_can: "In the can",
  at_risk: "Will miss", struck: "Struck"
};
const STRIKE = '<svg class="row__strike" viewBox="0 0 600 44" preserveAspectRatio="none" aria-hidden="true">' +
               '<path d="M4 34 C 150 20, 330 26, 596 9"/></svg>';

let deadline = 0;
let lastRevision = null;

const pad = n => String(n).padStart(2, "0");
const clock = s => { const d = new Date(s * 1000); return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); };

function tick() {
  const el = document.getElementById("clock");
  if (!deadline) { el.textContent = "--:--"; el.dataset.late = "false"; return; }
  const left = deadline - Math.floor(Date.now() / 1000);
  const a = Math.abs(left);
  el.textContent = "T" + (left < 0 ? "+" : "-") + pad(Math.floor(a / 60)) + ":" + pad(a % 60);
  el.dataset.late = String(left < 0);
}

// The row states the situation. It never computes a shortfall - that number is
// arithmetic, it already exists in the residuals, and deriving it twice is how
// two parts of one document start disagreeing.
function rowStatus(card) {
  if (card.state === "waiting" && card.eta_s) return "Ready in " + card.eta_s + "s";
  return STATUS[card.state] || card.state;
}

function renderRows(cards) {
  document.getElementById("rows").innerHTML = cards.map((c, i) => {
    const frame = c.thumbnail
      ? '<img class="row__frame" src="' + c.thumbnail + '" alt="Latest frame of ' + c.shot_id + '">'
      : '<div class="row__frame row__frame--empty">no frame</div>';
    return '<div class="row" data-state="' + c.state + '">' +
      (c.state === "struck" ? STRIKE : "") +
      '<span class="row__n">' + pad(i + 1) + '</span>' + frame +
      '<span class="row__shot">' + c.shot_id + '</span>' +
      '<span class="row__quality">' + c.quality + '</span>' +
      '<span class="row__count">' + c.frames_done + "/" + c.frames_total + '</span>' +
      '<span class="row__status">' + rowStatus(c) + '</span>' +
      '</div>';
  }).join("");
}

function renderAmendment(s) {
  document.getElementById("summary").textContent = s.summary || "No amendment has been issued.";

  const taken = (s.actions || []).map(a =>
    '<div class="act"><span class="act__verb">' + a.action + '</span>' +
    '<span class="act__why">' + a.shot_id + " &mdash; " + a.reason + '</span></div>').join("");
  const refused = (s.rejections || []).map(r =>
    '<div class="act act--refused"><span class="act__verb">' + r.action.action + '</span>' +
    '<span class="act__why">' + r.action.shot_id + " &mdash; " + r.reason + '</span></div>').join("");
  document.getElementById("acts").innerHTML = taken + refused;

  const open = (s.residuals || []).filter(r => !r.closed);
  document.getElementById("gap").hidden = open.length === 0;
  document.getElementById("gapLine").innerHTML =
    open.map(r => r.shot_id + " still short by " + r.shortfall_s + "s").join("<br>");
}

function renderFeed(events) {
  document.getElementById("feedEmpty").hidden = events.length > 0;
  document.getElementById("feed").innerHTML = events.slice().reverse().slice(0, 30).map(e =>
    '<li class="feed__item"><span class="feed__time">' + clock(e.at_epoch_s) + '</span>' +
    '<span>' + e.text + '</span></li>').join("");
}

function apply(s) {
  deadline = s.deadline_epoch_s || 0;
  const stock = s.stock || "white";
  const sheet = document.getElementById("sheet");

  document.getElementById("review").textContent =
    s.review_name + (deadline ? " · " + clock(deadline) : "");

  // A reissue is the one thing on this page worth watching, so it is played
  // rather than swapped. Only on a genuine revision change - a sheet that
  // animates every tick is a screensaver.
  if (lastRevision !== null && s.revision !== lastRevision) {
    sheet.classList.remove("sheet--issuing");
    void sheet.offsetWidth;
    sheet.classList.add("sheet--issuing");
  }
  lastRevision = s.revision;

  sheet.dataset.stock = stock;
  document.getElementById("stamp").innerHTML =
    '<span class="stamp__n">Rev ' + s.revision + '</span>' +
    '<span class="stamp__stock">' + (STOCK[stock] || stock) + '</span>';
  document.getElementById("sheetMeta").textContent =
    s.review_name + (deadline ? " · called for " + clock(deadline) : "");

  const banner = document.getElementById("banner");
  banner.dataset.show = String(Boolean(s.degraded_reason));
  banner.textContent = s.degraded_reason || "";

  renderRows(s.cards || []);
  renderAmendment(s);
  renderFeed(s.events || []);
  tick();
}

fetch("/api/state").then(r => r.json()).then(apply).catch(() => {});

const stream = new EventSource("/api/stream");
stream.addEventListener("state", e => {
  try { apply(JSON.parse(e.data)); } catch (err) { /* keep the last good sheet */ }
});

setInterval(tick, 1000);
</script>
</body>
</html>
