[project]
name = "callsheet"
version = "0.1.0"
description = "Render-farm production agent driven by observability telemetry"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "mcp>=1.2",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# httpx is not used by the app: it is what `fastapi.testclient` drives the ASGI
# app with, so the server tests cannot collect without it.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Blender installed or Grafana credentials present",
]
addopts = "-m 'not integration'"
